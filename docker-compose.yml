services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: hexpath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GEO_OWNER_PASSWORD: ${GEO_OWNER_PASSWORD}
      GEO_WRITER_PASSWORD: ${GEO_WRITER_PASSWORD}
      GEO_READER_PASSWORD: ${GEO_READER_PASSWORD}
    ports:
      - "55432:5432"
    volumes:
      - ./db/roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hexpath"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:

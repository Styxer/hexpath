name: fetch-osm
# Refreshes the committed OpenStreetMap extract. Data changes arrive as a PR,
# so they are reviewed like code (governed change, no manual edits to data).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e geo-pipeline
      - run: python -m geopipeline fetch-osm --out data/osm/tel-aviv-center.json.gz
      - run: ls -l data/osm/
      - name: report what the pipeline would do with it
        run: python -c "from geopipeline.pipeline import load_dataset; from geopipeline.validate import validate; from geopipeline.sources import SYNTHETIC_ZONES; ds = load_dataset('osm', SYNTHETIC_ZONES); print({k: len(getattr(ds, k)) for k in ('places','addresses','boundaries','nodes','edges')}, ds.dropped); [print(f) for f in validate(ds)]"
      - name: push to a review branch (merged by a person after review)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b data/osm-refresh
          git add data/osm/tel-aviv-center.json.gz
          git commit -m "data: refresh OpenStreetMap extract (© OpenStreetMap contributors, ODbL)"
          git push -f origin data/osm-refresh

name: bench
# Manual: corridor-search benchmark (PostGIS vs H3) on the committed OpenStreetMap extract.
on:
  workflow_dispatch:
jobs:
  corridor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -ntp -f geo-service/pom.xml -DskipTests package
      - run: cp .env.example .env && docker compose up -d --wait
      - run: pip install -e geo-pipeline
      - name: publish the committed extract
        run: |
          set -a; . ./.env; set +a
          python -m geopipeline migrate
          python -m geopipeline run --source osm
      - name: start the service
        run: |
          set -a; . ./.env; set +a
          nohup java -jar geo-service/target/geo-service-*.jar > service.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health/readiness && exit 0; sleep 2; done
          tail -50 service.log; exit 1
      - name: runner
        run: |
          nproc; free -h | head -2; lscpu | grep "Model name"
      - name: benchmark
        run: python bench/corridor/run.py --routes 200 --buffers 100,300,1000 --seed 7 --out results.json --emit-md table.md
      - uses: actions/upload-artifact@v4
        with:
          name: corridor-benchmark
          path: |
            results.json
            table.md

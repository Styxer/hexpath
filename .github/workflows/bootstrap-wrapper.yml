name: bootstrap-wrapper
# One-off: generates the Maven wrapper (mvnw, mvnw.cmd) so the service builds without a local Maven.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - working-directory: geo-service
        run: mvn -B -ntp -N wrapper:wrapper -Dtype=only-script
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geo-service/mvnw geo-service/mvnw.cmd geo-service/.mvn
          git commit -m "chore(service): add Maven wrapper"
          git push

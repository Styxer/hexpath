name: ci
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "geo-pipeline[test]"
      - name: unit tests
        working-directory: geo-pipeline
        run: pytest -q -m "not db"
      - name: benchmark helpers
        run: pytest -q bench
      - name: database tests (Testcontainers, postgis/postgis:17-3.5)
        working-directory: geo-pipeline
        run: pytest -q -m db
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: demo page unit tests
        run: node --test geo-service/src/test/js/*.test.mjs
  seed-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e geo-pipeline
      - name: regenerate the Java test seed and fail if it differs from the committed one
        run: |
          python -m geopipeline export-seed --out shared/seed/seed.sql
          git diff --exit-code shared/seed/seed.sql
  java:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: mvn verify (unit + Testcontainers integration tests)
        run: mvn -B -ntp -f geo-service/pom.xml verify
      - name: print generated OpenAPI contract (for review when the contract test fails)
        if: failure() && matrix.java == '21'
        run: |
          echo "----- BEGIN openapi-generated.yaml -----"
          cat geo-service/target/openapi-generated.yaml || true
          echo "----- END openapi-generated.yaml -----"
      - name: upload service jar
        if: matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
          name: geo-service-jar
          path: geo-service/target/geo-service-*.jar
      - name: upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports-${{ matrix.java }}
          path: |
            geo-service/target/surefire-reports/
            geo-service/target/failsafe-reports/
            geo-service/target/openapi-generated.yaml
  e2e:
    needs: java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v4
        with:
          name: geo-service-jar
          path: jar
      - name: start PostGIS
        run: cp .env.example .env && docker compose up -d --wait
      - run: pip install -e geo-pipeline -r e2e/requirements.txt
      - name: publish the committed OpenStreetMap extract
        run: |
          set -a; . ./.env; set +a
          python -m geopipeline migrate
          python -m geopipeline run --source osm
      - name: start the service
        run: |
          set -a; . ./.env; set +a
          nohup java -jar jar/geo-service-*.jar > service.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health/readiness && exit 0; sleep 2; done
          tail -50 service.log; exit 1
      - name: end-to-end tests
        run: |
          set -a; . ./.env; set +a
          pytest -q e2e
      - name: pipeline reports and service log
        if: always()
        run: |
          cat data/reports/*.md || true
          tail -100 service.log || true

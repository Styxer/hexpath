name: ci
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "geo-pipeline[test]"
      - name: unit tests
        working-directory: geo-pipeline
        run: pytest -q -m "not db"
      - name: database tests (Testcontainers, postgis/postgis:17-3.5)
        working-directory: geo-pipeline
        run: pytest -q -m db

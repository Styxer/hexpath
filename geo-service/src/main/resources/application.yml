spring:
  application:
    name: hexpath-geo-service
  datasource:
    url: ${HEXPATH_DB_URL:jdbc:postgresql://localhost:55432/hexpath}
    username: geo_reader
    password: ${GEO_READER_PASSWORD:reader-dev}
    hikari:
      # Fuzzy place search uses pg_trgm's word similarity (operator <%). The extension default
      # of 0.6 misses common Hebrew spelling variants (דיזינגוף vs דיזנגוף scores 0.545).
      connection-init-sql: SET pg_trgm.word_similarity_threshold = ${hexpath.search.word-similarity-threshold}
  jackson:
    property-naming-strategy: SNAKE_CASE
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,dataset
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      expiry:
        http.server.requests: 5m

logging:
  structured:
    format:
      console: ecs

hexpath:
  search:
    word-similarity-threshold: 0.5

spring:
  application:
    name: hexpath-geo-service
  datasource:
    url: ${HEXPATH_DB_URL:jdbc:postgresql://localhost:55432/hexpath}
    username: geo_reader
    password: ${GEO_READER_PASSWORD:reader-dev}
    hikari:
      # Fuzzy place search uses pg_trgm's word similarity (operator <%). The extension default
      # of 0.6 misses common Hebrew spelling variants (דיזינגוף vs דיזנגוף scores 0.545).
      connection-init-sql: SET pg_trgm.word_similarity_threshold = ${hexpath.search.word-similarity-threshold}
  jackson:
    property-naming-strategy: SNAKE_CASE
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,dataset
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.95
      expiry:
        http.server.requests: 5m

springdoc:
  api-docs:
    version: openapi_3_0          # openapi-diff, used by the contract test, reads OpenAPI 3.0
  override-with-generic-response: false
  default-produces-media-type: application/json
  writer-with-order-by-keys: true # stable output, so the committed contract diffs cleanly
  paths-to-match: /v1/**

logging:
  structured:
    format:
      console: ecs

hexpath:
  search:
    word-similarity-threshold: 0.5
  corridor:
    # postgis | h3. Decided by the benchmark recorded in docs/adr/0003-corridor-search.md.
    default-strategy: postgis
